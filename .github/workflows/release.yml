---

name: 'Release'

on:
  push:
    tags:
      - v*

permissions:
  contents: write # publish release assets

defaults:
  run:
    shell: bash

jobs:
  build:
    name: 'Build application'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup go'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 'Run GoReleaser'
        uses: goreleaser/goreleaser-action@v6
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          # .goreleaser.yml is in the v1 format (brews.tap, folder); v2 would need it migrated
          version: '~> v1'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          # Your GoReleaser Pro key, if you are using the 'goreleaser-pro' distribution
          # GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: 'Upload artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: ssm2env
          path: dist/*

  integration:
    name: 'Run integration tests and release'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup homebrew'
        uses: Homebrew/actions/setup-homebrew@2026.09.13.1

      - name: 'Install BATS'
        run: brew install bats-core

      - name: 'Download artifacts'
        uses: actions/download-artifact@v4
        with:
          name: ssm2env
          path: dist/

      - name: 'Configure AWS credentials'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: 'Run integration tests'
        env:
          TEST_SSM2ENV_EXECUTABLE: ./ssm2env
        run: |
          tar -xvzf dist/ssm2env_*_linux_amd64.tar.gz
          bats -r tests/*.bats

      - name: 'Upload the release assets'
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
